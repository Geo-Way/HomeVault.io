<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HomeVault</title>
  <style>
    :root{--primary:#1e3a8a;--accent:#0d9488;--danger:#dc2626;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1}
    *{box-sizing:border-box} body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px;min-height:100vh}
    .container{max-width:720px;margin:10px auto;background:var(--card);padding:16px;border-radius:14px;box-shadow:0 4px 14px #00000012}
    .header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px}
    h1,h2,h3{margin:0;color:var(--primary)} h1{font-size:20px} h2{font-size:18px} h3{font-size:16px}
    .lang{width:auto;padding:7px 9px}.field{margin-bottom:14px} label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}
    input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;font-size:16px;background:#fff}
    textarea{min-height:75px;resize:vertical} button{width:100%;padding:12px 14px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-weight:650;font-size:15px;cursor:pointer}
    button.secondary{background:#475569} button.accent{background:var(--accent)} button.danger{background:var(--danger)} button.small{width:auto;padding:9px 11px;font-size:13px}
    .nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}.nav button{margin:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;max-height:58vh;overflow:auto}
    .card{border:1px solid var(--border);border-radius:10px;padding:12px;background:#f8fafc;min-height:105px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
    .card .icon{font-size:28px}.name{font-size:13px;word-break:break-word}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}
    .notice{padding:10px;border-radius:9px;background:#ecfeff;border:1px solid #99f6e4;font-size:13px;margin-bottom:12px}
    .error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.hidden{display:none!important}.path{font-size:13px;color:var(--muted);margin:8px 0 12px;word-break:break-word}
    .modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
    .modalbox{background:#fff;width:100%;max-width:430px;border-radius:13px;padding:18px;max-height:90vh;overflow:auto}
    @media(max-width:480px){body{padding:4px}.container{padding:12px;margin:4px auto}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏠 HomeVault</h1>
    <select id="lang" class="lang" onchange="setLang(this.value)">
      <option value="de">🇩🇪 Deutsch</option><option value="es">🇪🇸 Español</option>
    </select>
  </div>

  <section id="login">
    <h2 id="loginTitle">Anmelden</h2>
    <div class="field"><label id="pinLabel">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
    <button onclick="login()" id="loginBtn">Anmelden</button>
    <div id="loginMsg" class="notice hidden"></div>
  </section>

  <section id="app" class="hidden">
    <div class="nav">
      <button onclick="show('capture')" id="navCapture">📤 Erfassen</button>
      <button onclick="show('local')" id="navLocal">📁 Lokal</button>
    </div>

    <div id="capture">
      <div class="notice" id="instantNotice">Das Dokument wird direkt auf dem PC gespeichert. Es gibt keine Synchronisation.</div>
      <div class="field">
        <label id="pcLabel">PC-Adresse</label>
        <input id="serverUrl" placeholder="http://192.168.1.50:8080">
      </div>
      <button class="secondary small" onclick="saveServer()" id="savePc">PC-Adresse speichern</button>
      <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
      <div class="field"><label id="catLabel">Kategorie</label><div class="row"><select id="cat" onchange="loadSubcats()"></select><button class="accent small" onclick="newFolder()">+ Kategorie</button></div></div>
      <div class="field"><label id="subLabel">Unterkategorie (optional)</label><select id="sub"><option value="">— Keine —</option></select></div>
      <div class="field"><label id="fileLabel">Foto / PDF / Datei</label><input id="file" type="file" accept="image/*,application/pdf,.pdf" capture="environment"></div>
      <div class="field"><label id="nameLabel">Dateiname (optional)</label><input id="name" placeholder="z.B. rechnung_strom"></div>
      <div class="field"><label id="commentLabel">Kommentar (optional)</label><textarea id="comment" placeholder="Notizen..."></textarea></div>
      <button class="accent" onclick="upload()" id="uploadBtn">📸 Direkt auf dem PC speichern</button>
      <div id="uploadMsg" class="notice hidden" style="margin-top:10px"></div>
    </div>

    <div id="local" class="hidden">
      <div class="row"><button class="accent small" onclick="loadRoot()" id="refresh">🔄 Aktualisieren</button><button class="secondary small" onclick="show('capture')" id="backCapture">📤 Erfassen</button></div>
      <div id="path" class="path">HomeVault</div>
      <div id="explorer" class="grid" style="margin-top:10px"></div>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden">
  <div class="modalbox">
    <h3 id="modalTitle">Neue Kategorie</h3>
    <div class="field"><label id="folderLabel">Name</label><input id="folderName"></div>
    <div class="row"><button class="accent" onclick="createFolder()" id="createBtn">Erstellen</button><button class="secondary" onclick="closeModal()" id="cancelBtn">Abbrechen</button></div>
  </div>
</div>

<div id="details" class="modal hidden">
  <div class="modalbox">
    <h3 id="detailName"></h3>
    <p id="detailInfo" class="muted"></p>
    <div class="field"><label id="detailCommentLabel">Kommentar</label><div id="detailComment" class="notice"></div></div>
    <div class="row"><button class="accent" onclick="openCurrent()" id="openBtn">Öffnen</button><button class="danger" onclick="deleteCurrent()" id="deleteBtn">Löschen</button></div>
    <button class="secondary" style="margin-top:8px" onclick="closeDetails()" id="closeBtn">Schließen</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
