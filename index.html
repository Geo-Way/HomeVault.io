<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">HomeVault - Mobile Local Edition</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z'/></svg>">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeVault">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #1e293b;
      --accent: #0d9488;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      position: relative;
      margin-top: 10px;
    }

    .hidden { display: none !important; }
    
    /* Cabecera superior adaptativa para que el idioma no tape nada */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .lang-switcher select {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
    }

    h2 { 
      margin: 0; 
      color: var(--primary); 
      font-size: 18px; 
    }

    .field { margin-bottom: 14px; }
    
    label { 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 600; 
      font-size: 13px; 
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      transition: background 0.2s;
    }
    button:active { opacity: 0.9; }
    button:hover { background: var(--primary-dark); }
    
    .nav-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .nav-buttons button { margin-top: 0; background: #475569; font-size: 13px; padding: 10px 6px; }
    .nav-buttons button:hover { background: #334155; }
    
    .explorer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 12px;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 2px;
    }
    
    .explorer-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
    }
    .explorer-card:hover { background: #f1f5f9; border-color: var(--primary); }
    .explorer-card .icon { font-size: 26px; margin-bottom: 4px; }
    .explorer-card .name { font-size: 12px; word-break: break-all; margin-bottom: 4px; }
    
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100;
      padding: 16px;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (max-width: 480px) {
      body { padding: 4px; }
      .container { padding: 12px; border-radius: 8px; }
      .explorer-grid { grid-template-columns: repeat(2, 1fr); }
      h2 { font-size: 16px; }
      button { font-size: 13px; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabecera limpia con título y selector de idioma al lado sin solaparse -->
    <div class="top-header">
      <h2 id="t-login-title">🔐 HomeVault Anmelden</h2>
      <div class="lang-switcher">
        <select id="lang-select" onchange="changeLanguage(this.value)">
          <option value="de" selected>🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
        </select>
      </div>
    </div>

    <!-- LOGIN / PIN -->
    <div id="pin-screen" class="view">
      <div class="field">
        <label id="t-pin-label">PIN eingeben:</label>
        <input type="password" id="pin-input" maxlength="4" placeholder="****" autocomplete="off" inputmode="numeric">
      </div>
      <button onclick="verifyPin()" id="t-login-btn">Anmelden</button>
    </div>

    <!-- APP CONTAINER -->
    <div id="app-container" class="view hidden">
      <div class="nav-buttons">
        <button onclick="showView('scan-view')" id="t-nav-scan">📤 Erfassen</button>
        <button onclick="showView('explore-view')" id="t-nav-explore">📁 Lokal</button>
        <button onclick="showView('sync-view')" id="t-nav-sync">🔄 PC Sync</button>
      </div>

      <!-- VISTA 1: CAPTURAR / GUARDAR LOCAL -->
      <div id="scan-view" class="view">
        <div class="field">
          <label id="t-cat-label">Kategorie (Hauptordner):</label>
          <div style="display: flex; gap: 8px;">
            <select id="cat-select" onchange="handleCatChange()" style="flex: 1;"></select>
            <button type="button" onclick="openCategoryModal()" style="width: auto; margin-top:0; background:var(--accent); padding: 0 16px;" title="Neue Kategorie">+</button>
          </div>
        </div>

        <div class="field">
          <label id="t-subcat-label">Unterkategorie (Optional):</label>
          <select id="subcat-select">
            <option value="">-- Keine --</option>
          </select>
        </div>

        <div class="field">
          <label id="t-file-label">Datei oder Foto:</label>
          <input type="file" id="file-input" capture="environment">
        </div>

        <div class="field">
          <label id="t-name-label">Dateiname (Optional):</label>
          <input type="text" id="custom-name-input" placeholder="z.B. rechnung">
        </div>

        <div class="field">
          <label id="t-comment-label">Kommentar / Metadaten (Optional):</label>
          <textarea id="meta-comment" placeholder="Notizen..."></textarea>
        </div>

        <button onclick="saveDocumentLocally()" style="background: var(--accent);" id="t-save-btn">Lokal auf dem Handy speichern</button>
      </div>

      <!-- VISTA 2: EXPLORADOR LOCAL -->
      <div id="explore-view" class="view hidden">
        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
          <button onclick="loadLocalExplorer()" style="background: var(--accent); margin-top: 0; padding: 8px 10px; width: auto; font-size: 13px;" id="t-refresh-btn">🔄 Aktualisieren</button>
        </div>
        <div id="explorer-grid" class="explorer-grid"></div>
      </div>

      <!-- VISTA 3: SINCRONIZACIÓN CON PC -->
      <div id="sync-view" class="view hidden">
        <p style="font-size: 13px; color:#475569; line-height: 1.4;" id="t-sync-desc">
          Asegúrate de que tu ordenador esté encendido y el servidor de Python en marcha.
        </p>
        <div class="field">
          <label id="t-ip-label">IP del PC (ej. 192.168.1.50 o localhost):</label>
          <input type="text" id="pc-ip-input" placeholder="192.168.1.50">
        </div>
        <button onclick="syncToPC()" style="background: var(--accent); margin-top: 10px;" id="t-sync-btn">Enviar todo al PC ahora</button>
      </div>
    </div>
  </div>

  <!-- MODAL NUEVA CATEGORÍA -->
  <div id="new-cat-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="t-modal-title" style="margin-top:0; color:var(--primary); font-size: 16px;">Kategorie / Ordner erstellen</h3>
      <div class="field">
        <label id="t-modal-parent-label">In bestehende Kategorie verschieben (Optional):</label>
        <select id="modal-parent-cat">
          <option value="">-- Keine (Hauptkategorie erstellen) --</option>
        </select>
      </div>
      <div class="field">
        <label id="t-modal-main-label">Name der neuen Hauptkategorie:</label>
        <input type="text" id="new-cat-input" placeholder="Z.B. Rechnungen">
      </div>
      <div class="field">
        <label id="t-modal-sub-label">Oder Name der Unterkategorie:</label>
        <input type="text" id="new-subcat-input" placeholder="Z.B. Februar">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 15px;">
        <button onclick="createNewCategory()" style="background: var(--accent); margin-top:0;" id="t-modal-create-btn">Erstellen</button>
        <button onclick="closeCategoryModal()" style="background: #64748b; margin-top:0;" id="t-modal-cancel-btn">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE DETALLES -->
  <div id="file-details-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-file-title" style="word-break: break-all; color: var(--primary); margin-top:0; font-size: 16px;">📄 Details</h3>
      
      <div class="field" style="margin-bottom: 10px;">
        <strong id="t-det-comment" style="font-size: 13px;">Kommentar / Notiz:</strong>
        <p id="modal-file-comment" style="background: #f1f5f9; padding: 10px; border-radius: 6px; margin: 4px 0 12px 0; font-size: 13px; white-space: pre-wrap; word-break: break-word;"></p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 15px;">
        <button onclick="printCurrentDoc()" style="background: var(--primary); margin-top:0;" id="t-btn-print">🖨️ Drucken / Imprimir</button>
        <button onclick="viewCurrentDoc()" style="background: var(--accent); margin-top:0;" id="t-btn-open">👁️ Öffnen / Ver</button>
        <button onclick="deleteCurrentDoc()" style="background: #dc2626; margin-top:0;" id="t-btn-delete">🗑️ Löschen / Eliminar</button>
        <button onclick="closeFileDetailsModal()" style="background: #64748b; margin-top:0;" id="t-btn-close">Schließen / Cerrar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
