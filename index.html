<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeVault - Dokumentenverwaltung</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- Pantalla de Login / PIN -->
  <div id="pin-screen" class="overlay">
    <div class="card">
      <h2 data-i18n="pinTitle">PIN-Eingabe</h2>
      <input type="password" id="pin-input" maxlength="4" placeholder="****" autocomplete="off">
      <br><br>
      <button onclick="verifyPin()" data-i18n="loginBtn">Anmelden</button>
      <p id="pin-error" class="error"></p>
    </div>
  </div>

  <!-- Contenedor Principal de la App -->
  <div id="app-container" class="hidden">
    <header>
      <h1>HomeVault <span id="mode-badge" class="badge">GitHub Edition</span></h1>
      <button onclick="toggleLanguage()">DE / ES</button>
    </header>

    <nav class="menu">
      <button onclick="showView('upload-view')" data-i18n="menuUpload">Dokumente hochladen</button>
      <button onclick="showView('explore-view')" data-i18n="menuExplore">Dokumente durchsuchen</button>
    </nav>

    <!-- Vista de Carga de Archivos / Cámara -->
    <section id="upload-view" class="view">
      <h2 data-i18n="uploadHeader">Dokument hochladen oder scannen</h2>
      <div class="field">
        <label data-i18n="catLabel">Kategorie:</label>
        <select id="cat-select" onchange="handleCatChange()"></select>
      </div>
      <div class="field">
        <label data-i18n="subCatLabel">Unterkategorie:</label>
        <select id="subcat-select"></select>
      </div>
      <button onclick="openCategoryModal()" data-i18n="newCatBtn">+ Neue Kategorie / Unterkategorie</button>
      <hr>
      <div class="field">
        <label data-i18n="customNameLabel">Dateiname (Optional):</label>
        <input type="text" id="custom-name-input" placeholder="z.B. Rechnung_2026">
      </div>
      <div class="actions">
        <input type="file" id="file-input" accept="image/png, image/jpeg, application/pdf">
        <br><br>
        <button onclick="uploadSelectedFile()" data-i18n="uploadFileBtn">Datei hochladen</button>
        <button onclick="startCamera()" data-i18n="useCameraBtn">Kamera benutzen</button>
      </div>

      <!-- Modal de Cámara -->
      <div id="camera-modal" class="modal hidden">
        <div class="card">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" class="hidden"></canvas>
          <div class="field" style="margin-top:10px;">
            <input type="text" id="cam-custom-name" placeholder="Dateiname / Nombre de archivo">
          </div>
          <div class="controls">
            <button onclick="capturePhoto()" data-i18n="captureBtn">Foto machen</button>
            <select id="format-select">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
              <option value="pdf">PDF</option>
            </select>
            <button onclick="saveCapture()" data-i18n="saveBtn">Speichern</button>
            <button onclick="stopCamera()" data-i18n="closeBtn">Schließen</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Vista Explorador estilo Windows -->
    <section id="explore-view" class="view hidden">
      <h2 data-i18n="exploreHeader">Dokumente durchsuchen</h2>
      
      <div class="explorer-bar">
        <button onclick="navigateUp()" id="back-btn">⬆️ <span data-i18n="upBtn">Nach oben</span></button>
        <div id="breadcrumbs" class="breadcrumbs"></div>
      </div>

      <div id="explorer-grid" class="explorer-grid"></div>
    </section>
  </div>

  <!-- Modal para Crear Nueva Categoría -->
  <div id="new-cat-modal" class="modal hidden">
    <div class="card">
      <h3 data-i18n="createCatTitle">Neue Kategorie / Unterkategorie</h3>
      
      <div class="field">
        <label data-i18n="selectParentCat">Bestehende Kategorie wählen (Optional):</label>
        <select id="modal-parent-cat" onchange="toggleModalCatInput()">
          <option value="">-- Neue Hauptkategorie erstellen --</option>
        </select>
      </div>

      <div class="field" id="new-main-cat-field">
        <label data-i18n="newMainCatLabel">Neue Hauptkategorie:</label>
        <input type="text" id="new-cat-input" placeholder="Kategoriename">
      </div>

      <div class="field">
        <label data-i18n="subCatLabel">Unterkategorie (Optional):</label>
        <input type="text" id="new-subcat-input" placeholder="Unterkategorie">
      </div>

      <br>
      <button onclick="createNewCategory()" data-i18n="saveBtn">Speichern</button>
      <button onclick="closeCategoryModal()" data-i18n="closeBtn">Abbrechen</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
